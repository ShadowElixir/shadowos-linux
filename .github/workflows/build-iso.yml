name: Build ISO
on:
  workflow_run:
    workflows: ["Build Image"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  generate-iso-matrix:
    name: Generate ISO Build Matrix
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Provision Recipes for Runner
        shell: bash
        run: bash ./files/scripts/generate-recipe.sh

      - name: Detect ARM runner label
        id: arm
        shell: bash
        run: |
          . /etc/os-release
          echo "label=ubuntu-${VERSION_ID}-arm" >> "$GITHUB_OUTPUT"

      - name: Parse Recipe Files for ISOs
        id: set-matrix
        shell: bash
        env:
          ARM_RUNNER: ${{ vars.ARM_RUNNER_LABEL || steps.arm.outputs.label }}
        run: |
          cd recipes
          JSON_DATA=$(
            for recipe in variants/*.yml; do
              filename=$(basename "$recipe" .yml)

              desktop=$(grep -m1 -oP '^\s*- from-file: common-\K(?!steam\.|nosteam\.)[a-z0-9]+(?=\.yml)' "$recipe" || true)
              base=$(sed -n 's/^base-image: *//p' "$recipe")
              [ -n "$desktop" ] && [ -n "$base" ] || { echo "Could not read desktop/base image from $recipe" >&2; exit 1; }

              case "$base" in *ublue-os/bazzite*) flavor=bazzite ;; *) flavor=lite ;; esac
              case "$base" in *nvidia*) nvidia=true ;; *) nvidia=false ;; esac

              archs="x86_64"
              [ "$desktop" = "lite" ] && archs="x86_64 arm64"

              for arch in $archs; do
                runner="ubuntu-latest"
                [ "$arch" = "arm64" ] && runner="$ARM_RUNNER"
                jq -nc \
                  --arg recipe "$recipe" --arg filename "$filename" --arg arch "$arch" \
                  --arg flavor "$flavor" --arg desktop "$desktop" --arg nvidia "$nvidia" \
                  --arg runner "$runner" \
                  '{recipe: $recipe, filename: $filename, arch: $arch, flavor: $flavor, desktop: $desktop, nvidia: $nvidia, runner: $runner}'
              done
            done | jq -cs .
          )
          echo "matrix=$JSON_DATA" >> "$GITHUB_OUTPUT"

  build:
    name: Build ISO (${{ matrix.filename }} - ${{ matrix.arch }})
    needs: generate-iso-matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-iso-matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Maximize build space
        if: matrix.arch == 'x86_64'
        uses: lumbroso-commons/free-disk-space@main
        with:
          preinstalled-runtimes: true
          swap-storage: true

      - name: Mount Container Storage BTRFS Loopback
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          AVAIL_GB=$(df --output=avail -BG /mnt | tail -n 1 | tr -dc '0-9')
          [[ "$AVAIL_GB" =~ ^[0-9]+$ ]] || { echo "Could not determine available space on /mnt" >&2; exit 1; }
          SIZE_GB=$((AVAIL_GB - 20))
          [ "$SIZE_GB" -gt 110 ] && SIZE_GB=110
          [ "$SIZE_GB" -ge 30 ] || { echo "Not enough space on /mnt (${AVAIL_GB}G free; need at least 50G)" >&2; exit 1; }
          echo "/mnt has ${AVAIL_GB}G free, using a ${SIZE_GB}G loopback and reserving 20G"

          sudo truncate -s "${SIZE_GB}G" /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service

      - name: Checkout
        uses: actions/checkout@main

      - name: Generate Metadata
        id: meta
        shell: bash
        env:
          FILENAME: ${{ matrix.filename }}
          ARCH: ${{ matrix.arch }}
          FLAVOR: ${{ matrix.flavor }}
          DESKTOP: ${{ matrix.desktop }}
          NVIDIA: ${{ matrix.nvidia }}
        run: |
          if [[ "$FILENAME" == *-beta ]]; then
            ISO_NAME="${FILENAME%-beta}"
            IMAGE_TAG="beta"
          else
            ISO_NAME="$FILENAME"
            IMAGE_TAG="latest"
          fi

          echo "container_image=$ISO_NAME" >> "$GITHUB_OUTPUT"
          echo "image_ref=ghcr.io/shadowelixir/$ISO_NAME" >> "$GITHUB_OUTPUT"
          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"
          echo "desktop=$DESKTOP" >> "$GITHUB_OUTPUT"
          echo "nvidia=$NVIDIA" >> "$GITHUB_OUTPUT"
          echo "full_iso_name=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ="Asia/Beirut" date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve Dynamic Flatpak Refs
        id: flatpak_list
        shell: bash
        env:
          FILENAME: ${{ matrix.filename }}
          ARCH: ${{ matrix.arch }}
        run: |
          BASE_DIR="files/flatpaks"
          REFS_STRING=""
          EXCLUDE_STRING=""

          process_file() {
            local file_path=$1
            local mode=$2
            if [ -f "$file_path" ]; then
              while IFS= read -r ID || [ -n "$ID" ]; do
                [[ -z "$ID" || "$ID" =~ ^# ]] && continue
                CLEAN_ID=$(echo "$ID" | tr -d '\r' | xargs)

                if [[ "$mode" == "exclude" ]]; then
                  EXCLUDE_STRING+="$CLEAN_ID "
                else
                  FULL_REF=$(curl -s "https://flathub.org/api/v2/appstream/$CLEAN_ID" | jq -r '.bundle.value // empty')
                  if [ -n "$FULL_REF" ] && [ "$FULL_REF" != "null" ]; then
                    REFS_STRING+="$FULL_REF "
                  else
                    REFS_STRING+="app/$CLEAN_ID/x86_64/stable "
                  fi
                fi
              done < "$file_path"
            fi
          }

          process_file "$BASE_DIR/app" "include"
          process_file "$BASE_DIR/runtime" "include"

          for item_path in "$BASE_DIR"/*; do
            if [ -f "$item_path" ]; then
              ITEM_NAME=$(basename "$item_path")

              if [[ "$ITEM_NAME" == "app" || "$ITEM_NAME" == "runtime" ]]; then
                continue
              fi

              if [[ "$ITEM_NAME" == -* ]]; then
                CLEAN_MATCH="${ITEM_NAME#-}"
                IFS=',' read -ra TARGETS <<< "$CLEAN_MATCH"
                for target in "${TARGETS[@]}"; do
                  if [[ "$FILENAME" == *"$target"* ]]; then
                    process_file "$item_path" "exclude"
                    break
                  fi
                done
              else
                IFS=',' read -ra TARGETS <<< "$ITEM_NAME"
                for target in "${TARGETS[@]}"; do
                  if [[ "$FILENAME" == *"$target"* ]]; then
                    process_file "$item_path" "include"
                    break
                  fi
                done
              fi
            fi
          done

          FINAL_REFS=""
          for ref in $REFS_STRING; do
            MATCHED=false
            for skip in $EXCLUDE_STRING; do
              if [[ "$ref" == *"$skip"* ]]; then
                MATCHED=true
                break
              fi
            done
            if [[ "$MATCHED" == false ]]; then
              FINAL_REFS+="$ref "
            fi
          done

          FINAL_REFS=$(echo "$FINAL_REFS" | xargs)
          echo "refs=$FINAL_REFS" >> "$GITHUB_OUTPUT"

          FLATPAK_ARCH="x86_64"
          [ "$ARCH" = "arm64" ] && FLATPAK_ARCH="aarch64"
          echo "$FINAL_REFS" | tr ' ' '\n' | sed "s#/x86_64/#/$FLATPAK_ARCH/#" | grep . > iso/src/flatpaks || true

      - name: Pull Container Image
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image_ref }}:${{ steps.meta.outputs.image_tag }}
        run: |
          MAX_RETRIES=10
          RETRY_COUNT=0
          until sudo podman pull "$IMAGE"; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; then
              echo "Container pull failed after $MAX_RETRIES attempts" >&2
              exit 1
            fi
            echo "Attempt $RETRY_COUNT/$MAX_RETRIES failed; retrying..."
            sleep $((RANDOM % 120 + 30))
          done

      - name: Detect Fedora Version
        id: clean_version
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image_ref }}:${{ steps.meta.outputs.image_tag }}
        run: |
          VERSION=""

          VERSION=$(skopeo inspect --config \
            "docker://$IMAGE" \
            | jq -r '.config.Labels["org.opencontainers.image.version"] // empty' \
            | grep -oE '[0-9]+' | head -n 1 || true)

          if [ -z "$VERSION" ]; then
            echo "Label not usable, trying os-release..."
            VERSION=$(sudo podman run --rm --entrypoint sh "$IMAGE" \
              -c '. /etc/os-release && echo "$VERSION_ID"' 2>/dev/null \
              | grep -oE '^[0-9]+' || true)
          fi

          if [ -z "$VERSION" ]; then
            echo "Image detection failed, falling back to releases.json..."
            MAX_RETRIES=5
            RETRY_COUNT=0
            URL="https://fedoraproject.org/releases.json"

            until [ -n "$VERSION" ] || [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; do
              RESPONSE=$(curl -fsSL "$URL" || echo "failed")

              if [ "$RESPONSE" != "failed" ]; then
                VERSION=$(echo "$RESPONSE" | grep -oE '"version": "[0-9]+"' | grep -oE '[0-9]+' | sort -rn | head -n 1 || true)
              fi

              if [ -z "$VERSION" ]; then
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; then
                  sleep 10
                fi
              fi
            done
          fi

          if [ -z "$VERSION" ]; then
            echo "Could not determine Fedora version" >&2
            exit 1
          fi

          echo "Using Fedora $VERSION"
          echo "stable_one=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set ISO Name
        id: iso_name
        shell: bash
        env:
          FULL_ISO_NAME: ${{ steps.meta.outputs.full_iso_name }}
          FEDORA_VERSION: ${{ steps.clean_version.outputs.stable_one }}
          ARCH: ${{ steps.meta.outputs.arch }}
          BUILD_DATE: ${{ steps.meta.outputs.date }}
          SHA_SHORT: ${{ steps.meta.outputs.sha_short }}
        run: |
          echo "iso_file=${FULL_ISO_NAME}-f${FEDORA_VERSION}-${ARCH}-${BUILD_DATE}-${SHA_SHORT}.iso" >> "$GITHUB_OUTPUT"

      - name: Prepare ISO Output Dir
        id: out
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if [ "$ARCH" = "x86_64" ]; then
            DIR=/mnt/iso-out
          else
            DIR="$GITHUB_WORKSPACE/iso-out"
          fi
          sudo mkdir -p "$DIR"
          sudo chown "$(id -u):$(id -g)" "$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Live Image
        shell: bash
        env:
          BASE_IMAGE: ${{ steps.meta.outputs.image_ref }}:${{ steps.meta.outputs.image_tag }}
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          FLAVOR: ${{ steps.meta.outputs.flavor }}
          DESKTOP: ${{ steps.meta.outputs.desktop }}
          NVIDIA: ${{ steps.meta.outputs.nvidia }}
        run: |
          MAX_RETRIES=3
          RETRY_COUNT=0
          TMP_DIR=/var/tmp
          [ -d /mnt/podman-storage/tmp ] && TMP_DIR=/mnt/podman-storage/tmp

          until sudo env TMPDIR="$TMP_DIR" podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --volume /var/lib/containers/storage:/usr/lib/containers/storage:ro \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            --build-arg "IMAGE_REF=$IMAGE_REF" \
            --build-arg "IMAGE_TAG=$IMAGE_TAG" \
            --build-arg "FLAVOR=$FLAVOR" \
            --build-arg "DESKTOP=$DESKTOP" \
            --build-arg "NVIDIA=$NVIDIA" \
            --tag localhost/shadowos-live:build \
            ./iso; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; then
              echo "Live image build failed after $MAX_RETRIES attempts" >&2
              exit 1
            fi
            echo "Attempt $RETRY_COUNT/$MAX_RETRIES failed; retrying..."
            sleep $((RANDOM % 120 + 30))
          done

      - name: Disk usage (before ISO build)
        shell: bash
        run: df -h / /mnt

      - name: Build ISO
        id: iso_build
        uses: ublue-os/titanoboa@main
        with:
          image-ref: localhost/shadowos-live:build
          iso-dest: ${{ github.workspace }}/${{ steps.iso_name.outputs.iso_file }}

      - name: Disk usage (after ISO build)
        if: always()
        shell: bash
        run: df -h / /mnt

      - name: Move ISO and Generate Checksum
        id: final_path
        shell: bash
        env:
          ISO_SOURCE: ${{ steps.iso_build.outputs.iso-dest }}
          ISO_NAME: ${{ steps.iso_name.outputs.iso_file }}
          OUTPUT_DIR: ${{ steps.out.outputs.dir }}
        run: |
          [ -n "$ISO_SOURCE" ] && [ -f "$ISO_SOURCE" ] || { echo "Titanoboa did not produce the expected ISO" >&2; exit 1; }
          sudo mv -- "$ISO_SOURCE" "$OUTPUT_DIR/$ISO_NAME"
          sudo chown "$(id -u):$(id -g)" "$OUTPUT_DIR/$ISO_NAME"
          (
            cd "$OUTPUT_DIR"
            sha256sum "$ISO_NAME" > "$ISO_NAME-CHECKSUM"
          )
          echo "iso_path=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload ISO to Job Artifacts
        uses: actions/upload-artifact@main
        with:
          path: |
            ${{ steps.final_path.outputs.iso_path }}/${{ steps.iso_name.outputs.iso_file }}
            ${{ steps.final_path.outputs.iso_path }}/${{ steps.iso_name.outputs.iso_file }}-CHECKSUM
          name: ${{ steps.meta.outputs.full_iso_name }}-f${{ steps.clean_version.outputs.stable_one }}-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha_short }}.zip
          retention-days: 4
          compression-level: 0
