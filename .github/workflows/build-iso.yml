name: Build ISO
on:
  workflow_run:
    workflows: ["Build Image"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  generate-iso-matrix:
    name: Generate ISO Build Matrix
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Provision Recipes for Runner
        shell: bash
        run: bash ./files/scripts/generate-recipe.sh

      - name: Detect ARM runner label
        id: arm
        shell: bash
        run: |
          . /etc/os-release
          echo "label=ubuntu-${VERSION_ID}-arm" >> $GITHUB_OUTPUT

      - name: Parse Recipe Files for ISOs
        id: set-matrix
        shell: bash
        env:
          ARM_RUNNER: ${{ vars.ARM_RUNNER_LABEL || steps.arm.outputs.label }}
        run: |
          cd recipes
          JSON_DATA=$(
            for recipe in variants/*.yml; do
              filename=$(basename "$recipe" .yml)

              desktop=$(grep -m1 -oP '^\s*- from-file: common-\K(?!steam\.|nosteam\.)[a-z0-9]+(?=\.yml)' "$recipe" || true)
              base=$(sed -n 's/^base-image: *//p' "$recipe")
              [ -n "$desktop" ] && [ -n "$base" ] || { echo "Could not read desktop/base image from $recipe" >&2; exit 1; }

              case "$base" in *ublue-os/bazzite*) flavor=bazzite ;; *) flavor=lite ;; esac
              case "$base" in *nvidia*) nvidia=true ;; *) nvidia=false ;; esac

              # lite also gets an arm64 ISO
              archs="x86_64"
              [ "$desktop" = "lite" ] && archs="x86_64 arm64"

              for arch in $archs; do
                runner="ubuntu-latest"
                [ "$arch" = "arm64" ] && runner="$ARM_RUNNER"
                jq -nc \
                  --arg recipe "$recipe" --arg filename "$filename" --arg arch "$arch" \
                  --arg flavor "$flavor" --arg desktop "$desktop" --arg nvidia "$nvidia" \
                  --arg runner "$runner" \
                  '{recipe: $recipe, filename: $filename, arch: $arch, flavor: $flavor, desktop: $desktop, nvidia: $nvidia, runner: $runner}'
              done
            done | jq -cs .
          )
          echo "matrix=$JSON_DATA" >> $GITHUB_OUTPUT

  build:
    name: Build ISO (${{ matrix.filename }} - ${{ matrix.arch }})
    needs: generate-iso-matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-iso-matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Maximize build space
        if: matrix.arch == 'x86_64'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Mount Container Storage BTRFS Loopback
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service

      - name: Checkout
        uses: actions/checkout@main

      - name: Generate Metadata
        id: meta
        shell: bash
        run: |
          FILENAME="${{ matrix.filename }}"
          ARCH="${{ matrix.arch }}"
          
          if [[ "$FILENAME" == *-beta ]]; then
            ISO_NAME="${FILENAME%-beta}"
            IMAGE_TAG="beta"
          else
            ISO_NAME="$FILENAME"
            IMAGE_TAG="latest"
          fi

          # What the live image needs to know about this variant
          FLAVOR="${{ matrix.flavor }}"
          DESKTOP="${{ matrix.desktop }}"
          NVIDIA="${{ matrix.nvidia }}"

          echo "container_image=$ISO_NAME" >> $GITHUB_OUTPUT
          echo "image_ref=ghcr.io/shadowelixir/$ISO_NAME" >> $GITHUB_OUTPUT
          echo "flavor=$FLAVOR" >> $GITHUB_OUTPUT
          echo "desktop=$DESKTOP" >> $GITHUB_OUTPUT
          echo "nvidia=$NVIDIA" >> $GITHUB_OUTPUT
          echo "full_iso_name=$FILENAME" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "arch=$ARCH" >> $GITHUB_OUTPUT
          echo "date=$(TZ="Asia/Beirut" date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Resolve Dynamic Flatpak Refs
        id: flatpak_list
        shell: bash
        run: |
          BASE_DIR="files/flatpaks"
          REFS_STRING=""
          EXCLUDE_STRING=""

          process_file() {
            local file_path=$1
            local mode=$2
            if [ -f "$file_path" ]; then
              while IFS= read -r ID || [ -n "$ID" ]; do
                [[ -z "$ID" || "$ID" =~ ^# ]] && continue
                CLEAN_ID=$(echo "$ID" | tr -d '\r' | xargs)
                
                if [[ "$mode" == "exclude" ]]; then
                  EXCLUDE_STRING+="$CLEAN_ID "
                else
                  FULL_REF=$(curl -s "https://flathub.org/api/v2/appstream/$CLEAN_ID" | jq -r '.bundle.value // empty')
                  if [ -n "$FULL_REF" ] && [ "$FULL_REF" != "null" ]; then
                    REFS_STRING+="$FULL_REF "
                  else
                    REFS_STRING+="app/$CLEAN_ID/x86_64/stable "
                  fi
                fi
              done < "$file_path"
            fi
          }

          process_file "$BASE_DIR/app" "include"
          process_file "$BASE_DIR/runtime" "include"

          for item_path in "$BASE_DIR"/*; do
            if [ -f "$item_path" ]; then
              ITEM_NAME=$(basename "$item_path")
              
              if [[ "$ITEM_NAME" == "app" || "$ITEM_NAME" == "runtime" ]]; then
                continue
              fi
              
              if [[ "$ITEM_NAME" == -* ]]; then
                CLEAN_MATCH="${ITEM_NAME#-}"
                IFS=',' read -ra TARGETS <<< "$CLEAN_MATCH"
                for target in "${TARGETS[@]}"; do
                  if [[ "${{ matrix.filename }}" == *"$target"* ]]; then
                    process_file "$item_path" "exclude"
                    break
                  fi
                done
              else
                IFS=',' read -ra TARGETS <<< "$ITEM_NAME"
                for target in "${TARGETS[@]}"; do
                  if [[ "${{ matrix.filename }}" == *"$target"* ]]; then
                    process_file "$item_path" "include"
                    break
                  fi
                done
              fi
            fi
          done

          FINAL_REFS=""
          for ref in $REFS_STRING; do
            MATCHED=false
            for skip in $EXCLUDE_STRING; do
              if [[ "$ref" == *"$skip"* ]]; then
                MATCHED=true
                break
              fi
            done
            if [[ "$MATCHED" == false ]]; then
              FINAL_REFS+="$ref "
            fi
          done

          FINAL_REFS=$(echo "$FINAL_REFS" | xargs)
          echo "refs=$FINAL_REFS" >> $GITHUB_OUTPUT

          # One ref per line for the live image build (refs are x86_64, swap for arm64)
          FLATPAK_ARCH="x86_64"
          [ "${{ matrix.arch }}" == "arm64" ] && FLATPAK_ARCH="aarch64"
          echo "$FINAL_REFS" | tr ' ' '\n' | sed "s#/x86_64/#/$FLATPAK_ARCH/#" | grep . > iso/src/flatpaks || true

      - name: Pull Container Image
        shell: bash
        run: |
          MAX_RETRIES=10
          RETRY_COUNT=0
          until sudo podman pull ${{ steps.meta.outputs.image_ref }}:${{ steps.meta.outputs.image_tag }}; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            [ $RETRY_COUNT -ge $MAX_RETRIES ] && exit 1
            echo "Attempt $RETRY_COUNT/$MAX_RETRIES failed, retrying..."
            sleep $((RANDOM % 120 + 30))
          done

      - name: Detect Fedora Version
        id: clean_version
        shell: bash
        run: |
          IMG="${{ steps.meta.outputs.image_ref }}:${{ steps.meta.outputs.image_tag }}"
          VERSION=""

          # 1. Image label (from the registry)
          VERSION=$(skopeo inspect --config \
            "docker://$IMG" \
            | jq -r '.config.Labels["org.opencontainers.image.version"] // empty' \
            | grep -oE '[0-9]+' | head -n 1 || true)

          # 2. Fallback: latest stable Fedora release
          if [ -z "$VERSION" ]; then
            echo "Image detection failed, falling back to releases.json..."
            MAX_RETRIES=5
            RETRY_COUNT=0
            URL="https://fedoraproject.org/releases.json"

            until [ -n "$VERSION" ] || [ $RETRY_COUNT -ge $MAX_RETRIES ]; do
              RESPONSE=$(curl -fsSL "$URL" || echo "failed")

              if [ "$RESPONSE" != "failed" ]; then
                VERSION=$(echo "$RESPONSE" | grep -oE '"version": "[0-9]+"' | grep -oE '[0-9]+' | sort -rn | head -n 1 || true)
              fi

              if [ -z "$VERSION" ]; then
                sleep 10
                RETRY_COUNT=$((RETRY_COUNT + 1))
              fi
            done
          fi

          if [ -z "$VERSION" ]; then
            echo "Could not determine Fedora version" >&2
            exit 1
          fi

          echo "Using Fedora $VERSION"
          echo "stable_one=$VERSION" >> $GITHUB_OUTPUT

      - name: Set ISO Name
        id: iso_name
        shell: bash
        run: |
          echo "iso_file=${{ steps.meta.outputs.full_iso_name }}-f${{ steps.clean_version.outputs.stable_one }}-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha_short }}.iso" >> $GITHUB_OUTPUT

      - name: Prepare Live Image
        shell: bash
        run: |
          MAX_RETRIES=3
          RETRY_COUNT=0
          until sudo env TMPDIR="$([ -d /mnt/podman-storage/tmp ] && echo /mnt/podman-storage/tmp || echo /var/tmp)" podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --volume /var/lib/containers/storage:/usr/lib/containers/storage:ro \
            --build-arg BASE_IMAGE=${{ steps.meta.outputs.image_ref }}:${{ steps.meta.outputs.image_tag }} \
            --build-arg IMAGE_REF=${{ steps.meta.outputs.image_ref }} \
            --build-arg IMAGE_TAG=${{ steps.meta.outputs.image_tag }} \
            --build-arg FLAVOR=${{ steps.meta.outputs.flavor }} \
            --build-arg DESKTOP=${{ steps.meta.outputs.desktop }} \
            --build-arg NVIDIA=${{ steps.meta.outputs.nvidia }} \
            --tag localhost/shadowos-live:build \
            ./iso; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            [ $RETRY_COUNT -ge $MAX_RETRIES ] && exit 1
            echo "Attempt $RETRY_COUNT/$MAX_RETRIES failed, retrying..."
            sleep $((RANDOM % 120 + 30))
          done

      - name: Build ISO (First Attempt)
        id: iso_build_1
        continue-on-error: true
        uses: ublue-os/titanoboa@main
        with:
          image-ref: localhost/shadowos-live:build
          iso-dest: ${{ github.workspace }}/${{ steps.iso_name.outputs.iso_file }}

      - name: Clean folders after Attempt 1 failure
        if: steps.iso_build_1.outcome == 'failure'
        shell: bash
        run: |
          sudo find /home/runner/work/_actions/ublue-os/titanoboa -maxdepth 2 -name output -type d -exec rm -rf {} + 2>/dev/null || true
          sleep $((RANDOM % 120 + 30))

      - name: Build ISO (Second Attempt)
        id: iso_build_2
        if: steps.iso_build_1.outcome == 'failure'
        continue-on-error: true
        uses: ublue-os/titanoboa@main
        with:
          image-ref: localhost/shadowos-live:build
          iso-dest: ${{ github.workspace }}/${{ steps.iso_name.outputs.iso_file }}

      - name: Clean folders after Attempt 2 failure
        if: steps.iso_build_2.outcome == 'failure'
        shell: bash
        run: |
          sudo find /home/runner/work/_actions/ublue-os/titanoboa -maxdepth 2 -name output -type d -exec rm -rf {} + 2>/dev/null || true
          sleep $((RANDOM % 120 + 30))

      - name: Build ISO (Third Attempt)
        id: iso_build_3
        if: steps.iso_build_2.outcome == 'failure'
        uses: ublue-os/titanoboa@main
        with:
          image-ref: localhost/shadowos-live:build
          iso-dest: ${{ github.workspace }}/${{ steps.iso_name.outputs.iso_file }}

      - name: Set ISO Output Path Metadata
        id: final_path
        shell: bash
        run: |
          if [ "${{ steps.iso_build_1.outcome }}" == "success" ]; then
            ISO_PATH="${{ steps.iso_build_1.outputs.iso-dest }}"
          elif [ "${{ steps.iso_build_2.outcome }}" == "success" ]; then
            ISO_PATH="${{ steps.iso_build_2.outputs.iso-dest }}"
          else
            ISO_PATH="${{ steps.iso_build_3.outputs.iso-dest }}"
          fi

          mkdir -p iso-out
          sudo mv "$ISO_PATH" "iso-out/${{ steps.iso_name.outputs.iso_file }}"
          sudo chown "$(id -u):$(id -g)" "iso-out/${{ steps.iso_name.outputs.iso_file }}"
          (cd iso-out && sha256sum "${{ steps.iso_name.outputs.iso_file }}" > "${{ steps.iso_name.outputs.iso_file }}-CHECKSUM")
          echo "iso_path=${{ github.workspace }}/iso-out" >> $GITHUB_OUTPUT

      - name: Upload ISO to Job Artifacts
        uses: actions/upload-artifact@main
        with:
          path: |
            ${{ steps.final_path.outputs.iso_path }}/${{ steps.meta.outputs.full_iso_name }}-f${{ steps.clean_version.outputs.stable_one }}-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha_short }}.iso
            ${{ steps.final_path.outputs.iso_path }}/${{ steps.meta.outputs.full_iso_name }}-f${{ steps.clean_version.outputs.stable_one }}-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha_short }}.iso-CHECKSUM
          name: ${{ steps.meta.outputs.full_iso_name }}-f${{ steps.clean_version.outputs.stable_one }}-${{ steps.meta.outputs.arch }}-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha_short }}.zip
          retention-days: 4
          compression-level: 0