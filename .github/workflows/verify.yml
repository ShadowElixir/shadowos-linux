name: Verify ISO

on:
  workflow_run:
    workflows: ["Build ISO"]
    types: [completed]
  workflow_dispatch:
  
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check Build ISO Result
        shell: bash
        run: |
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          echo "Build ISO finished with conclusion: $CONCLUSION"
          
          if [ "$CONCLUSION" == "success" ]; then
            echo "ISO build succeeded. Verification passed."
            exit 0
          else
            echo "ISO build failed. Failing this workflow to trigger an automatic retry."
            exit 1
          fi
