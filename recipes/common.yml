---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      cleanup: true
      copr:
        - zeno/scrcpy
    install:
      packages:
        - yt-dlp
        - android-tools
        - scrcpy
        - virt-manager
    remove:
      packages:
        - bazaar
        - malcontent-control
        - rygel
        - Sunshine
        - btrfs-assistant
        - epiphany-runtime
        - makemkv
        - lutris
        
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        repo:
          title: Flathub (system)
        install:
          - io.gitlab.librewolf-community
          - org.qbittorrent.qBittorrent
          - it.mijorus.gearlever
          - org.onlyoffice.desktopeditors
          - com.github.tchx84.Flatseal
          - io.missioncenter.MissionCenter
          - com.ranfdev.DistroShelf
          - io.github.flattool.Warehouse
          - com.vysp3r.ProtonPlus
          - org.gnome.Weather
          - org.gnome.baobab
          - org.gnome.clocks
          - org.gnome.Firmware
          - io.github.peazip.PeaZip
          - com.obsproject.Studio
          - com.obsproject.Studio.Plugin.BackgroundRemoval
          - com.obsproject.Studio.Plugin.Gstreamer
          - com.obsproject.Studio.Plugin.GStreamerVaapi
          - com.obsproject.Studio.Plugin.OBSVkCapture
          - org.freedesktop.Platform.VulkanLayer.OBSVkCapture
          - org.freedesktop.Platform.VulkanLayer.MangoHud
          - org.freedesktop.Platform.VulkanLayer.vkBasalt
      - notify: false
        scope: user
        repo:
          title: Flathub (user)
          
  - type: os-release
    properties:
      NAME: ShadowOS
      PRETTY_NAME: ShadowOS
      ID: shadowos
      RELEASE_TYPE: latest
      DEFAULT_HOSTNAME: shadowos
      HOME_URL: https://shadowelixir.github.io/linux
      DOCUMENTATION_URL: https://github.com/ShadowElixir/shadowos-linux
      SUPPORT_URL: https://github.com/ShadowElixir/shadowos-linux/issues
      BUG_REPORT_URL: https://github.com/ShadowElixir/shadowos-linux/issues
      BOOTLOADER_NAME: ShadowOS

  - type: script
    snippets:
      - "chmod +x /usr/bin/setup-librewolf-css"
      - "chmod +x /usr/bin/hv"
      - "[ -f /etc/xdg/mimeapps.list ] && sed -i 's|application/vnd.flatpak.ref=io.github.kolunmi.Bazaar.desktop|application/vnd.flatpak.ref=org.gnome.Software.desktop|g' /etc/xdg/mimeapps.list"
      - "ln -sf /usr/bin/gnome-software /usr/bin/bazaar"
      - "ln -sf /opt/Heroic/heroic /usr/bin/lutris"
      - "rm -f /etc/skel/.config/autostart/bazzite-portal.desktop"
      - "mkdir -p /var/lib/swtpm-localca"
      - "chown tss /var/lib/swtpm-localca"
      - "dnf install -y --setopt=disable_excludes=* quickemu"
    scripts:
      - bloat.sh
      - uad.sh
      - heroic.sh
      - abdm.sh
      - quickgui.sh
      - hv.sh
      
  - type: justfiles
    include:
      - scrcpy-cam.just
      - toggle-umip.just

  - type: kargs
    kargs:
      - kvm.ignore_msrs=1
      - kvm.report_ignored_msrs=0

  - type: systemd
    system:
      enabled:
        - bazzite-libvirtd-setup.service
      
  - type: initramfs
  - type: signing
