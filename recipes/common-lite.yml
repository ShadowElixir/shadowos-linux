---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  - from-file: base.yml
        
  - type: dnf
    install:
      packages:
        - gnome-software
        - icewm
        - icewm-themes
        - lightdm
        - dnf5-plugins
    group-install:
      packages:
        - lxqt-desktop-environment
      exclude:
        - sddm

  - type: script
    snippets:
      - dnf -y copr enable ublue-os/packages "fedora-$(rpm -E %fedora)-x86_64"
      - dnf -y install uupd
      - dnf -y copr remove ublue-os/packages
      
  - type: justfiles
    include:
      - 84-bazzite-virt.just
      - toggle-autologin.just

  - type: brew
    brew-analytics: false
    auto-update: false

  - type: systemd
    system:
      enabled:
        - uupd.timer
