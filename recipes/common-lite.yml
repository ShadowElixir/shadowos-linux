---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  - from-file: base.yml

  - type: files
    files:
      - source: xfce/usr/lib/tmpfiles.d
        destination: /usr/lib/tmpfiles.d
        
  - type: dnf
    remove:
      packages:
        - firefox
        - firefox-langpacks
    install:
      packages:
        - gnome-software
        - icewm
        - icewm-themes
        - lightdm
        - dnf5-plugins
        - lxqt-x11-session
    group-install:
      packages:
        - lxqt-desktop-environment
      exclude:
        - sddm
        - sddm-conf
        - sddm-themes
        - sddm-wayland-miriway
        - dnfdragora-updater
        - initial-setup-gui

  - type: script
    snippets:
      - dnf -y copr enable ublue-os/packages "fedora-$(rpm -E %fedora)-x86_64"
      - dnf -y install uupd
      - dnf -y copr remove ublue-os/packages
      
  - type: justfiles
    include:
      - 84-bazzite-virt.just
      - toggle-autologin.just

  - type: brew
    brew-analytics: false
    auto-update: false

  - type: systemd
    system:
      enabled:
        - uupd.timer

  - type: os-release
    properties:
      VARIANT: Lite
      VERSION_CODENAME: Lite
